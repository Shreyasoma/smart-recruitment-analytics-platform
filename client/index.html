<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Recruitment Platform — Login</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="login-page">
    <div class="login-container">
      <!-- HEADER -->
      <div class="login-header">
        <div class="login-logo"></div>
        <h1 id="form-title">Welcome back</h1>
        <p id="form-subtitle">Sign in to your recruitment dashboard</p>
      </div>

      <!-- LOGIN FORM -->
      <div id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@company.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" />
        </div>
        <button class="btn btn-primary" id="login-btn">Sign In</button>
        <p class="toggle-text">
          Don't have an account?
          <span class="toggle-link" id="go-to-register">Register here</span>
        </p>
      </div>

      <!-- REGISTER FORM (hidden by default) -->
      <div id="register-form" style="display: none">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="register-name" placeholder="Your full name" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="register-email"
            placeholder="you@company.com"
          />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            id="register-password"
            placeholder="••••••••"
          />
        </div>
        <button class="btn btn-primary" id="register-btn">
          Create Account
        </button>
        <p class="toggle-text">
          Already have an account?
          <span class="toggle-link" id="go-to-login">Sign in here</span>
        </p>
      </div>

      <!-- ERROR / SUCCESS MESSAGE -->
      <div id="error-message"></div>
    </div>
    <script src="./js/login.js"></script>
  </body>
</html>
