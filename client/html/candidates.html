<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Recruitment Platform — Candidates</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="../js/config.js"></script>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <span class="navbar-brand">⚡ RecruitIQ</span>
      <div class="navbar-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="candidates.html" class="active">Candidates</a>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>

    <!-- PAGE CONTENT -->
    <div class="page-content">
      <!-- PAGE HEADER -->
      <div class="page-header">
        <h1>Candidates</h1>
        <p>Manage your recruitment pipeline</p>
      </div>

      <!-- ADD CANDIDATE FORM -->
      <div class="add-candidate-card">
        <h2>Add New Candidate</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>Name</label>
            <input type="text" placeholder="John Doe" id="name" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="john@company.com" id="email" />
          </div>
          <div class="form-group">
            <label>Score</label>
            <input
              type="number"
              placeholder="0 - 100"
              id="score"
              min="0"
              max="100"
            />
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option value="applied">Applied</option>
              <option value="interviewing">Interviewing</option>
              <option value="hired">Hired</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
          <div class="form-group">
            <label>Skills</label>
            <input
              type="text"
              placeholder="JavaScript, Python, SQL"
              id="skills"
            />
          </div>
        </div>
        <button
          class="btn btn-primary"
          id="add-candidate"
          style="width: auto; padding: 0.875rem 2rem"
        >
          Add Candidate
        </button>
      </div>

      <!-- CANDIDATES TABLE -->
      <div class="table-card">
        <div class="table-header">
          <h2>All Candidates</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Score</th>
              <th>Status</th>
              <th>Prediction</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="candidates-table"></tbody>
        </table>
      </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="edit-modal" class="modal-overlay" style="display: none">
      <div class="modal">
        <div class="modal-header">
          <h2>Edit Candidate</h2>
          <button class="modal-close" id="close-modal">&times;</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id" />
          <div class="form-grid">
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="edit-name" placeholder="John Doe" />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input
                type="email"
                id="edit-email"
                placeholder="john@company.com"
              />
            </div>
            <div class="form-group">
              <label>Score</label>
              <input
                type="number"
                id="edit-score"
                placeholder="0 - 100"
                min="0"
                max="100"
              />
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="edit-status">
                <option value="applied">Applied</option>
                <option value="interviewing">Interviewing</option>
                <option value="hired">Hired</option>
                <option value="rejected">Rejected</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" id="cancel-modal">Cancel</button>
          <button
            class="btn btn-primary"
            id="save-edit"
            style="width: auto; padding: 0.75rem 2rem"
          >
            Save Changes
          </button>
        </div>
      </div>
    </div>

    <script src="../js/candidates.js"></script>
    <script>
      function logout() {
        localStorage.removeItem('token');
        window.location.href = '../index.html';
      }
    </script>
  </body>
</html>
